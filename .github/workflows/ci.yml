name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Reject repository-only files in the wheel
        shell: python
        run: |
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          unexpected = [
              name for name in names
              if name.startswith(("tests/", "samples/", "tools/"))
          ]
          assert not unexpected, unexpected

      - name: Smoke-test the wheel entry point
        run: |
          pip install dist/*.whl
          pii-mask-lito --help

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Presidio needs a spaCy model. Without it the Presidio/spaCy checks skip
      # themselves, which would make this workflow green while testing much
      # less than it looks like it does.
      - name: Cache the spaCy model
        id: spacy-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pii-mask-lito-spacy
          key: en_core_web_lg-3.8.0-${{ matrix.python-version }}

      - name: Install en_core_web_lg
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/pii-mask-lito-spacy
          url=https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
          wheel=~/.cache/pii-mask-lito-spacy/en_core_web_lg-3.8.0-py3-none-any.whl
          [ -f "$wheel" ] || curl -sSfL -o "$wheel" "$url"
          pip install "$wheel"

      - name: Check that the CLI is installed
        run: pii-mask-lito --help

      - name: Run the test suite
        run: pytest tests/ -q

  synthetic-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install native readers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libgl1

      - name: Install quality-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,tesseract,vision,barcode]'
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build the license-clean synthetic corpus
        run: python -m tests.corpus.build

      - name: Enforce detection and mask-geometry floors
        run: python -m tests.corpus.gate
